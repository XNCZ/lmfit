[package]
name = "lmfit"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Arbitrary curve fitting, modelled on Python's lmfit"
license = "MIT"
readme = "README.md"
repository = "https://github.com/XNCZ/lmfit"
keywords = ["curve-fitting", "leastsq", "levenberg-marquardt", "optimization", "fitting"]
categories = ["science", "mathematics", "algorithms"]

[workspace]
members = ["derive"]

[dependencies]
levenberg-marquardt = "0.15.0"
nalgebra = "0.34"
num-complex = "0.4"
lmfit_derive = { version = "0.1.0", path = "derive" }
